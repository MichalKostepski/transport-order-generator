name: Demo smoke tests

on:
  push:
    paths:
      - 'app/**'
      - 'demo/**'
      - 'assets/template.pdf'
      - 'requirements.txt'
      - '.github/workflows/demo-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Linux Qt libraries and Unicode fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinput0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libfontconfig1 fonts-dejavu-core
      - name: Report any missing Qt xcb shared libraries
        if: runner.os == 'Linux'
        run: |
          ldd "$(python -c 'from pathlib import Path; import PySide6; print(Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqxcb.so")')" | grep "not found" || true
      - name: Check Python source and isolated demo
        run: |
          python -m compileall -q app demo
          python demo/test_demo.py
          python narzedzia/test_parser.py
          python narzedzia/test_aplikacji.py
      - name: Capture genuine Qt screenshots from isolated demo
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          TRANSPORT_DEMO_HOME: ${{ runner.temp }}/TransportDeskScreenshotDemo
        run: xvfb-run -a python demo/capture_screenshots.py
      - name: Upload Qt screenshots for inspection
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: transportdesk-ui-captures
          path: |
            docs/screenshots/pdf-editor.png
            docs/screenshots/order-history.png
          if-no-files-found: error
      - name: Publish reviewed fictional-data GUI gallery
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/pdf-editor.png docs/screenshots/order-history.png
          if git diff --cached --quiet; then
            echo "Screenshot gallery is up to date."
          else
            git commit -m "docs: publish legible demo Qt screenshots [skip ci]"
            git push origin HEAD:main
          fi
