name: Build Windows portable demo

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "demo/*.py"
      - "demo/BUILD_EXE_WINDOWS.ps1"
      - "assets/template.pdf"
      - "requirements.txt"
      - ".github/workflows/windows-portable-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: python -m pip install -r requirements.txt "pyinstaller>=6.13,<7"

      - name: Test source demo
        run: |
          python -m compileall -q app demo
          python demo/test_demo.py
          python narzedzia/test_parser.py
          python narzedzia/test_aplikacji.py

      - name: Build portable Windows app
        run: ./demo/BUILD_EXE_WINDOWS.ps1

      - name: Smoke-test packaged GUI (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          TRANSPORT_DEMO_HOME: ${{ runner.temp }}\transportdesk-packed-test
        run: |
          $exe = Join-Path $PWD "dist\TransportDeskDemo\TransportDeskDemo.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          $result = Join-Path $env:TRANSPORT_DEMO_HOME "smoke-test.txt"
          if (Test-Path $result) { Get-Content $result }
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $result)) {
            $errFile = Join-Path $env:TRANSPORT_DEMO_HOME "last_launch_error.txt"
            if (Test-Path $errFile) { Get-Content $errFile }
            throw "Portable demo failed smoke test. Exit code: $($proc.ExitCode)"
          }

      - name: Package portable folder
        run: Compress-Archive -Path "dist/TransportDeskDemo" -DestinationPath "dist/TransportDeskDemo-Windows-x64.zip" -CompressionLevel Optimal

      - name: Save Windows build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportDeskDemo-Windows-x64
          path: dist/TransportDeskDemo-Windows-x64.zip
          retention-days: 90
          if-no-files-found: error

      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "demo-build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "dist/TransportDeskDemo-Windows-x64.zip" --target "$env:GITHUB_SHA" --title "TransportDesk Demo - Windows build $env:GITHUB_RUN_NUMBER" --notes "Portable Windows x64 demonstration build. Extract the archive and run TransportDeskDemo.exe. Contains a neutral PDF template and fictional sample data. Built and smoke-tested on GitHub Actions; no Python installation required." --latest
